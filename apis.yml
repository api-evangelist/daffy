name: Daffy
description: 'Daffy (the Daffy Charitable Fund) is a modern donor-advised fund (DAF) platform that helps
  people be more generous, more often. Co-founded by Adam Nash, Daffy lets members set aside money for
  charity, invest it tax-free across ETFs, individual stocks, and 300+ crypto assets, and then recommend
  grants to any of 1.7M+ eligible US charities on their own timeline. It offers flat-rate membership
  pricing starting at $3/month, family funds for up to 24 members, advisor integration, and Daffy for
  Work employer giving. Daffy Charitable Fund is a tax-exempt public charity under IRC 501(c)(3). Backed
  by Ribbit Capital, it operates as a consumer fintech app with no public developer API surface as of
  this profile.'
